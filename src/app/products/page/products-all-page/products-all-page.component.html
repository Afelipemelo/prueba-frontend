<h1 class="text-3xl font-bold font-montserrat text-center">Todos los productos</h1>
    <h2 class="text-xl mb-5 text-center">Para todos los gustos</h2>
    <app-pagination
        [pages]="(productResource()!.meta.total_pages || 0)"
        [currentPage]="paginationService.currentPage()"
        (pageChanged)="loadProducts($event)"
      >
    </app-pagination>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4  gap-3 mt-10">
      @for(resource of (productResource()!.data); track $index){
  <product-card [product]="resource.attributes"></product-card>
}
      @empty {
        <p>No hay productos </p>
      }
    </div>
