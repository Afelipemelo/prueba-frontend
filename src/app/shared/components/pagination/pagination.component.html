<div class="join flex justify-center items-center ">
  @for(page of getPages(); track page){
  <button
    class="join-item btn "
    [class.btn-primary] = "page == currentPage()"
    [routerLink]="[]"
    [queryParams]="{page:page}"
    (click)="selectPage(page)"
    >
    {{page}}
  </button>

  }
</div>
